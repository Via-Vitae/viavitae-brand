<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="vv-logomark-title">
  <title id="vv-logomark-title">ViaVitae logomark</title>

  <!--
    THE MARK: an ichthys constructed as a vesica piscis.

    This is not a drawn fish with two arcs that happen to look like geometry. It
    is the geometry. Two circles of equal radius, each passing through a point on
    the other, intersect in a lens — the vesica piscis — and the arcs continued
    past one intersection diverge into a tail. That is the classical construction
    of the ichthys, and it is the reason the mark is built from circle arcs
    rather than from bezier curves: the curves are exactly circular, so the mark
    can be reconstructed with a compass, cut from sheet material, and verified
    numerically rather than by eye.

    CONSTRUCTION, in this 512 unit artboard.

      R   = 250                       radius of both circles
      Cu  = (276, 406)                centre of the circle whose arc is the
                                      UPPER edge of the body
      Cl  = (276, 106)                centre of the circle whose arc is the
                                      LOWER edge of the body
      A   = ( 76, 256)                the two circles cross here and at B
      B   = (476, 256)
      T   = (276, 156)                apex of the upper arc
      Bo  = (276, 356)                apex of the lower arc
      U   = ( 36, 336)                upper tail tip, on circle Cu
      L   = ( 36, 176)                lower tail tip, on circle Cl

    Every coordinate above is an integer and every one of them satisfies its
    circle equation exactly. A = Cu + (-200, -150) and 200^2 + 150^2 = 62500
    = 250^2, a 3-4-5 triangle scaled by 50, which is why the numbers come out
    whole. U = Cu + (-240, -70) and 240^2 + 70^2 = 62500 = 250^2 as well, so the
    tail tips sit on the same two circles as the body and are not drawn
    separately. The path bounding box is x from 36 to 476 and y from 156 to 356,
    which is 440 by 200 and centred exactly on (256, 256).

    The body is 2:1 — width 400 against height 200. The two centres are 300
    apart, which is 1.2R. A true vesica piscis sets the centres one radius apart
    and gives a lens of 1.732:1; opening the separation to 1.2R widens the lens
    to 2:1, which is the proportion a fish body actually has and which reads as
    a fish rather than as an eye or a leaf. The body arcs each span 106.26
    degrees. The tail is the same two arcs continued 20.61 degrees past the
    crossing point — far enough to read as a caudal fin, not far enough to make
    the mark wider than it needs to be.

    INCLUDING THE STROKE, the artwork occupies x from 16.16 to 492 and y from 140
    to 372, so 475.84 by 232. The vertical optical centre is exactly 256 but the
    horizontal optical centre is 254.08, about two units left of the geometric
    centre, because the round caps on the two tail tips reach further left than
    the round join at B reaches right. The path geometry is centred exactly and
    that is what the construction diagram measures; the two-unit optical offset
    is a property of stroking an asymmetric silhouette and is left uncorrected,
    since correcting it would mean moving the geometry off its own construction.

    STROKE, NOT FILL. The mark is monoline: one weight, round caps, round joins.
    The stroke is 32 units on a 512 artboard, which is 1/16 of the artboard.
    That ratio is deliberate and it is the same ratio the icon system uses — at
    the 24px icon size a 1.5px stroke is also 1/16 — so the mark and the icons
    drawn beside it carry the same weight at the same rendered size. See
    tokens/icons.json.

    MINIMUM SIZE. 24px, at which the stroke renders as 1.5px. Below that the
    stroke falls under one device pixel on a standard display and the mark
    antialiases into a grey blur. For anything at 32px or smaller use
    assets/favicon/favicon.svg instead, which is a separate filled master drawn
    for small sizes rather than a scaled-down copy of this one.
  -->

  <g fill="none" stroke="#0E1B3D" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body: the vesica piscis. Two arcs of radius 250, the first swept
         clockwise over the top around Cu, the second clockwise under the
         bottom around Cl, closing the lens at A and B. -->
    <path d="M 76 256 A 250 250 0 0 1 476 256 A 250 250 0 0 1 76 256 Z"/>
    <!-- Upper tail: circle Cu continued past A, diverging downward. -->
    <path d="M 76 256 A 250 250 0 0 0 36 336"/>
    <!-- Lower tail: circle Cl continued past A, diverging upward. The two
         tails cross the body's arcs at A, which is the whole construction. -->
    <path d="M 76 256 A 250 250 0 0 1 36 176"/>
  </g>
</svg>
