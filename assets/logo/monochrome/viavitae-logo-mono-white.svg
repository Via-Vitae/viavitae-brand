<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="vv-mono-white-title">
  <title id="vv-mono-white-title">ViaVitae</title>

  <!--
    ONE-COLOUR WHITE. The inline lockup in pure white on a transparent artboard,
    for a one-ink process on a dark or coloured ground: white screen printing on
    navy fabric, a white vinyl cut on glass or a dark vehicle, a white foil, an
    engraved fill, and any photograph dark enough to carry it. 21.00:1 on black
    and 16.90:1 on navy-900, both far above the WCAG 2.2 non-text minimum of 3:1.

    White is #FFFFFF and not ivory-100. Same reasoning as the black variant: a
    one-ink process has no ivory, and a specification it cannot honour gets
    substituted silently. Where the process can hold ivory, use
    assets/logo/inverse/viavitae-logo-inverse-navy.svg, which is the brand
    ivory rather than a process white.

    Do not place this on a light ground. A white lockup on ivory measures
    1.05:1 and is effectively invisible, which is a more common mistake than it
    sounds, because the file looks correct in an editor whose canvas is dark.

    Geometry is byte-identical to viavitae-logo-horizontal.svg; only the colour
    differs.
  -->

  <!-- MARK: vesica piscis ichthys, half scale, positioned so the round caps on
       the tail tips land on the clear-space boundary at x = 50. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 78 100 A 125 125 0 0 1 278 100 A 125 125 0 0 1 78 100 Z"/>
    <path d="M 78 100 A 125 125 0 0 0 58 140"/>
    <path d="M 78 100 A 125 125 0 0 1 58 60"/>
  </g>

  <!-- WORDMARK: V I A V I T A E, filled outlines. -->
  <g fill="#FFFFFF">
    <!-- V -->
    <path d="M 320 50 L 355 150 L 390 50 L 376 50 L 355 110 L 334 50 Z"/>
    <!-- I -->
    <path d="M 416 50 H 430 V 150 H 416 Z"/>
    <!-- A: chevron plus crossbar, one path so the fill cannot separate them -->
    <path d="M 456 150 L 491 50 L 526 150 L 512 150 L 491 90 L 470 150 Z M 477 112 H 505 V 126 H 477 Z"/>
    <!-- V -->
    <path d="M 552 50 L 587 150 L 622 50 L 608 50 L 587 110 L 566 50 Z"/>
    <!-- I -->
    <path d="M 648 50 H 662 V 150 H 648 Z"/>
    <!-- T -->
    <path d="M 688 50 H 758 V 64 H 730 V 150 H 716 V 64 H 688 Z"/>
    <!-- A -->
    <path d="M 784 150 L 819 50 L 854 150 L 840 150 L 819 90 L 798 150 Z M 805 112 H 833 V 126 H 805 Z"/>
    <!-- E -->
    <path d="M 880 50 H 950 V 64 H 894 V 93 H 936 V 107 H 894 V 136 H 950 V 150 H 880 Z"/>
  </g>
</svg>
