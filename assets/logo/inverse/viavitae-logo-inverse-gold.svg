<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="vv-inverse-gold-title">
  <title id="vv-inverse-gold-title">ViaVitae</title>

  <!--
    INVERSE FOR A NAVY GROUND, in brand gold. The ceremonial register: a cover,
    a certificate, a donation acknowledgement, an order of service for a wedding
    or a funeral, a plaque, foil blocking. Gold-500 #C9A227 on navy-900 measures
    6.98:1, on navy-800 6.04:1 and on navy-950 7.74:1 — all three above the
    WCAG 2.2 AA threshold of 4.5:1 for text at any size and well above the 3:1
    non-text minimum, so this is a decorative variant that happens also to be
    fully accessible rather than one that has to be justified.

    THIS IS THE ONLY PLACE gold-500 IS PERMITTED AS A FOREGROUND ON ITS OWN. On a
    light ground gold-500 measures 2.20:1 against ivory and 2.42:1 against
    white, and fails AA, AA-large and the 3:1 non-text threshold all at once;
    tokens/colors.json records both failures in its prohibited list and
    tools/contrast_check.py asserts they still fail. Gold on navy works because
    navy is dark enough to carry it. Gold on ivory does not, and no amount of
    brand enthusiasm changes the arithmetic.

    Use this version sparingly. The ivory inverse is the default on a dark
    ground; gold is for an occasion. A product UI that renders its header in
    gold on every page has spent the ceremonial register on chrome.

    Geometry is byte-identical to viavitae-logo-horizontal.svg; only the colour
    differs.
  -->

  <!-- MARK: vesica piscis ichthys, half scale, positioned so the round caps on
       the tail tips land on the clear-space boundary at x = 50. -->
  <g fill="none" stroke="#C9A227" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 78 100 A 125 125 0 0 1 278 100 A 125 125 0 0 1 78 100 Z"/>
    <path d="M 78 100 A 125 125 0 0 0 58 140"/>
    <path d="M 78 100 A 125 125 0 0 1 58 60"/>
  </g>

  <!-- WORDMARK: V I A V I T A E, filled outlines. -->
  <g fill="#C9A227">
    <!-- V -->
    <path d="M 320 50 L 355 150 L 390 50 L 376 50 L 355 110 L 334 50 Z"/>
    <!-- I -->
    <path d="M 416 50 H 430 V 150 H 416 Z"/>
    <!-- A: chevron plus crossbar, one path so the fill cannot separate them -->
    <path d="M 456 150 L 491 50 L 526 150 L 512 150 L 491 90 L 470 150 Z M 477 112 H 505 V 126 H 477 Z"/>
    <!-- V -->
    <path d="M 552 50 L 587 150 L 622 50 L 608 50 L 587 110 L 566 50 Z"/>
    <!-- I -->
    <path d="M 648 50 H 662 V 150 H 648 Z"/>
    <!-- T -->
    <path d="M 688 50 H 758 V 64 H 730 V 150 H 716 V 64 H 688 Z"/>
    <!-- A -->
    <path d="M 784 150 L 819 50 L 854 150 L 840 150 L 819 90 L 798 150 Z M 805 112 H 833 V 126 H 805 Z"/>
    <!-- E -->
    <path d="M 880 50 H 950 V 64 H 894 V 93 H 936 V 107 H 894 V 136 H 950 V 150 H 880 Z"/>
  </g>
</svg>
