<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="vv-mono-black-title">
  <title id="vv-mono-black-title">ViaVitae</title>

  <!--
    ONE-COLOUR BLACK. The inline lockup in pure black on a transparent artboard,
    for every reproduction process that has one ink and no choice about it:
    newspaper and parish newsletter print, a fax, a rubber stamp, laser engraving,
    embroidery, a vinyl cut, a photocopier, and a supplier who will not be
    persuaded otherwise. 21.00:1 on white and 19.11:1 on the ivory page surface,
    so it is the highest-contrast version of the lockup that exists.

    Black here is #000000 and not navy-900. That is deliberate and it is the one
    place the brand permits pure black: a one-ink process cannot mix a navy, and
    specifying #0E1B3D to a printer with one drum produces either a refusal or a
    silent substitution. Where the process CAN hold navy, use the primary lockup
    instead — this version is a fallback for a constraint, not an alternative
    treatment to choose on taste.

    Geometry is byte-identical to viavitae-logo-horizontal.svg; only the colour
    differs, and that is enforced rather than intended. The check step of
    tools/build_exports.py compares every path in this file against the master's,
    in order and character for character, and fails the build on any difference,
    so editing the master without regenerating the variants is a red build rather
    than a fifth logotype quietly entering circulation. The same check asserts
    that the paint is one of five measured colours and no other.

    Note for anyone editing this comment: XML forbids a double hyphen anywhere
    inside a comment, so a command-line flag cannot be written here literally.
    Spell the step out in words instead.
  -->

  <!-- MARK: vesica piscis ichthys, half scale, positioned so the round caps on
       the tail tips land on the clear-space boundary at x = 50. -->
  <g fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 78 100 A 125 125 0 0 1 278 100 A 125 125 0 0 1 78 100 Z"/>
    <path d="M 78 100 A 125 125 0 0 0 58 140"/>
    <path d="M 78 100 A 125 125 0 0 1 58 60"/>
  </g>

  <!-- WORDMARK: V I A V I T A E, filled outlines. -->
  <g fill="#000000">
    <!-- V -->
    <path d="M 320 50 L 355 150 L 390 50 L 376 50 L 355 110 L 334 50 Z"/>
    <!-- I -->
    <path d="M 416 50 H 430 V 150 H 416 Z"/>
    <!-- A: chevron plus crossbar, one path so the fill cannot separate them -->
    <path d="M 456 150 L 491 50 L 526 150 L 512 150 L 491 90 L 470 150 Z M 477 112 H 505 V 126 H 477 Z"/>
    <!-- V -->
    <path d="M 552 50 L 587 150 L 622 50 L 608 50 L 587 110 L 566 50 Z"/>
    <!-- I -->
    <path d="M 648 50 H 662 V 150 H 648 Z"/>
    <!-- T -->
    <path d="M 688 50 H 758 V 64 H 730 V 150 H 716 V 64 H 688 Z"/>
    <!-- A -->
    <path d="M 784 150 L 819 50 L 854 150 L 840 150 L 819 90 L 798 150 Z M 805 112 H 833 V 126 H 805 Z"/>
    <!-- E -->
    <path d="M 880 50 H 950 V 64 H 894 V 93 H 936 V 107 H 894 V 136 H 950 V 150 H 880 Z"/>
  </g>
</svg>
