# Dependabot configuration — viavitae-template
#
# Weekly, grouped dependency updates for every ecosystem a generated repository
# may use. Delete the ecosystems that do not apply to the repository type; keep
# the schedule, grouping and reviewer settings identical across the organisation
# so update pull requests are predictable.
#
# Security updates are configured separately, in repository settings under
# "Dependabot security updates", and are not governed by this file. They must
# remain enabled: a known-vulnerable dependency is fixed on Dependabot's schedule
# regardless of the grouping below.

version: 2

updates:

  # --- Python (pip) -----------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vilnius"
    open-pull-requests-limit: 10
    reviewers:
      - "viavitae-org/architects"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major bumps are a deliberate decision, not an automated one. They are
      # scheduled by the architects and recorded in CHANGELOG.md.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Pinned on purpose — see docs/architecture.md for the ADR that pins each.
      - dependency-name: "python"
      - dependency-name: "pydantic"
        update-types:
          - "version-update:semver-major"

  # --- Node (npm) -------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vilnius"
    open-pull-requests-limit: 10
    reviewers:
      - "viavitae-org/architects"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Framework majors are a migration project, scheduled separately.
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # --- GitHub Actions ---------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vilnius"
    open-pull-requests-limit: 10
    reviewers:
      - "viavitae-org/platform"
      - "viavitae-org/architects"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Actions are pinned to full-length commit SHAs under rule R4. Dependabot
      # moves the SHA and reports the resolved tag in the pull request body;
      # never relax a pin back to a mutable tag or branch reference.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # --- Terraform --------------------------------------------------------------
  # Applies to viavitae-infra and any repository holding provider or module
  # references. Delete this block elsewhere.
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vilnius"
    open-pull-requests-limit: 10
    reviewers:
      - "viavitae-org/platform"
      - "viavitae-org/security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      providers:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Provider majors can change resource schemas and force replacement of
      # production infrastructure. Always applied manually after a plan review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # --- Docker -----------------------------------------------------------------
  # Applies where a Dockerfile exists. Delete this block elsewhere.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vilnius"
    open-pull-requests-limit: 10
    reviewers:
      - "viavitae-org/platform"
      - "viavitae-org/security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      base-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Base image majors (for example python:3.12 -> 3.13) are a runtime
      # upgrade decision, coordinated with the test matrix in ci.yml.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
